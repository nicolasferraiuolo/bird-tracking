<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tempe Town Lake Bird Tracker</title>
<style>
:root{--bg:#f6f4ed;--card:#fff;--ink:#17221c;--muted:#69746d;--accent:#285943;--soft:#dfece5;--line:#d8ddd9}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:var(--accent);color:#fff;padding:28px 18px}.wrap{max-width:900px;margin:auto}
h1{margin:0 0 5px}.sub{opacity:.9}.stats{margin-top:14px;font-weight:700}.tabs{display:flex;gap:8px;margin:20px 0;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.tab.active{background:var(--accent);color:#fff}.panel{display:none}.panel.active{display:block}
main{padding:0 18px 50px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}.group{margin:24px 0}.group h2{font-size:18px;color:#345344}
.bird{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:7px 0}.seen{background:var(--soft);border-color:#9dbba9}.mark{font-size:22px;color:var(--accent)}.date{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.photo{width:100%;height:300px;display:block;object-fit:cover;background:#e9ece9}.body{padding:16px}.body h3{margin:0 0 5px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-top:13px}.body p,.body li{line-height:1.5}.body ul{padding-left:20px}
textarea{width:100%;min-height:90px;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:16px}.save{margin-top:7px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.saved{font-size:12px;color:var(--muted);margin-left:8px}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><h1>Salt River · Tempe Town Lake</h1><div class="sub">Personal bird checklist & photo log</div><div class="stats">✓ 7 species collected · Started November 8, 2026</div></div></header>
<main class="wrap"><div class="tabs"><button class="tab active" data-tab="check">Checklist</button><button class="tab" data-tab="collection">My Collection · 7</button></div>
<section id="check" class="panel active"><input id="search" class="search" placeholder="Search birds…"><div id="list"></div></section>
<section id="collection" class="panel"><p>Your photographed species from the Tempe Town Lake / Salt River birding area.</p><div class="grid" id="cards"></div></section></main>
<script>
const collected=[
{name:"Great Blue Heron",image:"images/sightings/great-blue-heron-2026-11-08.jpeg",date:"November 8, 2026",desc:"A huge blue-gray wading bird with very long legs, an S-shaped neck, and a heavy dagger-like bill.",facts:["It may stand almost motionless before striking at prey with remarkable speed.","Despite its size, it commonly perches and nests high in trees."]},
{name:"Great Egret",image:"images/sightings/great-egret-2026-11-08.jpeg",date:"November 8, 2026",desc:"A tall, elegant all-white heron with a long neck, dark legs, and a yellowish bill.",facts:["It hunts by stalking slowly through shallow water before making a rapid strike.","Its recovery from the plume trade became an important symbol of bird conservation."]},
{name:"Double-crested Cormorant",image:"images/sightings/cormorants-2026-11-23.jpeg",date:"November 23, 2026",desc:"A large dark waterbird with a long neck, hooked bill, and orange-yellow facial skin.",facts:["It is a powerful underwater pursuit diver.","Its paired crests are easiest to see during breeding season."]},
{name:"Neotropic Cormorant",image:"images/sightings/cormorants-2026-11-23.jpeg",date:"November 23, 2026",desc:"A smaller, slimmer cormorant with a proportionally long tail.",facts:["Its range extends through Central and much of South America.","Arizona offers chances to compare it directly with Double-crested Cormorants."]},
{name:"Black Phoebe",image:"images/sightings/black-phoebe-2026-11-23.jpeg",date:"November 23, 2026",desc:"A small dark flycatcher strongly associated with water, bridges, culverts, and low hunting perches.",facts:["It often pumps or wags its tail while perched.","It darts from low perches to catch flying insects."]},
{name:"Great-tailed Grackle",image:"images/sightings/great-tailed-grackle-2026-11-23.jpeg",date:"November 23, 2026",desc:"A large long-tailed blackbird common around parks, lawns, waterways, and urban areas.",facts:["Males have a remarkably long keel-shaped tail.","Their calls include whistles, clicks, rattles, and harsh notes."]},
{name:"Mourning Dove",image:"images/sightings/mourning-dove-2026-11-23.jpeg",date:"November 23, 2026",desc:"A slender soft-colored dove with a small head, spotted wings, and a long pointed tail.",facts:["Its name comes from the male's mournful cooing song.","Its wings can whistle audibly during takeoff."]}
];
const groups={
"Waterfowl":["Canada Goose","Greater White-fronted Goose","Ross's Goose","Mallard","Mexican Duck","Gadwall","American Wigeon","Northern Shoveler","Northern Pintail","Green-winged Teal","Cinnamon Teal","Blue-winged Teal","Canvasback","Redhead","Ring-necked Duck","Lesser Scaup","Bufflehead","Common Goldeneye","Ruddy Duck","Common Merganser","Hooded Merganser"],
"Grebes, Cormorants & Pelicans":["Pied-billed Grebe","Eared Grebe","Western Grebe","Clark's Grebe","Neotropic Cormorant","Double-crested Cormorant","American White Pelican","Brown Pelican"],
"Herons, Egrets & Ibis":["Great Blue Heron","Great Egret","Snowy Egret","Green Heron","Black-crowned Night-Heron","Cattle Egret","Least Bittern","American Bittern","White-faced Ibis"],
"Shorebirds":["Killdeer","Black-necked Stilt","American Avocet","Spotted Sandpiper","Least Sandpiper","Western Sandpiper","Greater Yellowlegs","Lesser Yellowlegs","Long-billed Dowitcher","Wilson's Snipe","Wilson's Phalarope","Long-billed Curlew"],
"Gulls & Terns":["Ring-billed Gull","California Gull","Franklin's Gull","Forster's Tern"],
"Raptors":["Osprey","Bald Eagle","Red-tailed Hawk","Cooper's Hawk","Sharp-shinned Hawk","Northern Harrier","Harris's Hawk","American Kestrel","Merlin","Peregrine Falcon","Prairie Falcon","Turkey Vulture"],
"Rails & Coots":["American Coot","Common Gallinule","Sora","Virginia Rail"],
"Doves & Quail":["Mourning Dove","White-winged Dove","Eurasian Collared-Dove","Inca Dove","Common Ground Dove","Rock Pigeon","Gambel's Quail"],
"Desert & Riparian Birds":["Greater Roadrunner","Gila Woodpecker","Ladder-backed Woodpecker","Northern Flicker","Belted Kingfisher","Black Phoebe","Say's Phoebe","Vermilion Flycatcher","Western Kingbird","Ash-throated Flycatcher","Loggerhead Shrike","Common Raven","Verdin","Cactus Wren","Bewick's Wren","Marsh Wren","Ruby-crowned Kinglet","Northern Mockingbird","Curve-billed Thrasher","Abert's Towhee","Phainopepla"],
"Hummingbirds":["Anna's Hummingbird","Costa's Hummingbird","Black-chinned Hummingbird","Broad-billed Hummingbird","Rufous Hummingbird"],
"Swallows":["Northern Rough-winged Swallow","Tree Swallow","Violet-green Swallow","Barn Swallow","Cliff Swallow","Bank Swallow"],
"Warblers, Sparrows & Other Small Birds":["Yellow-rumped Warbler","Orange-crowned Warbler","Yellow Warbler","Lucy's Warbler","Common Yellowthroat","Wilson's Warbler","Black-throated Gray Warbler","Townsend's Warbler","Western Tanager","Lesser Goldfinch","House Finch","Song Sparrow","Lincoln's Sparrow","White-crowned Sparrow","Savannah Sparrow","Black-throated Sparrow"],
"Common Urban Birds":["Great-tailed Grackle","European Starling","House Sparrow"]};
const seen=new Map(collected.map(x=>[x.name,x]));
function render(q=""){const root=document.getElementById("list");root.innerHTML="";Object.entries(groups).forEach(([g,names])=>{const matches=names.filter(n=>n.toLowerCase().includes(q.toLowerCase()));if(!matches.length)return;const s=document.createElement("div");s.className="group";s.innerHTML="<h2>"+g+"</h2>";matches.forEach(n=>{const b=seen.get(n),d=document.createElement("div");d.className="bird "+(b?"seen":"");d.innerHTML='<span class="mark">'+(b?"✓":"○")+'</span><div><strong>'+n+'</strong><span class="date">'+(b?"First seen: "+b.date:"Not yet recorded")+"</span></div>";s.appendChild(d)});root.appendChild(s)})}
function cards(){const root=document.getElementById("cards");collected.forEach(b=>{const key=b.name.toLowerCase().replace(/[^a-z0-9]+/g,"-");const c=document.createElement("article");c.className="card";c.innerHTML='<img class="photo" src="'+b.image+'" alt="Your '+b.name+' sighting"><div class="body"><h3>'+b.name+'</h3><div class="date">✓ First seen '+b.date+' · Salt River / Tempe Town Lake</div><div class="label">About this bird</div><p>'+b.desc+'</p><div class="label">Fun facts</div><ul>'+b.facts.map(x=>"<li>"+x+"</li>").join("")+'</ul><div class="label">My field notes</div><textarea data-key="'+key+'" placeholder="Behavior, number seen, exact area, weather, what you noticed…"></textarea><div><button class="save" data-key="'+key+'">Save notes</button><span class="saved" data-msg="'+key+'"></span></div></div>';root.appendChild(c)});document.querySelectorAll("textarea").forEach(x=>{try{x.value=localStorage.getItem("ttl-note-"+x.dataset.key)||""}catch(e){}});document.querySelectorAll(".save").forEach(b=>b.onclick=()=>{const a=document.querySelector('textarea[data-key="'+b.dataset.key+'"]'),m=document.querySelector('[data-msg="'+b.dataset.key+'"]');try{localStorage.setItem("ttl-note-"+b.dataset.key,a.value);m.textContent="Saved on this device ✓"}catch(e){m.textContent="Could not save"}})}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("active",x.id===b.dataset.tab))});document.getElementById("search").oninput=e=>render(e.target.value);render();cards();
</script></body></html>
